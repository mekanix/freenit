[package]
name = "freenit"
version = "0.0.1"
edition = "2024"
default-run = "freenit"

[features]
default = ["calendar", "contacts", "files", "jabber", "kanban", "ldap", "mail", "sql", "webmail"]
calendar = ["dep:chrono", "dep:dziber", "dep:uuid", "dziber/calendar", "topcoat/multipart"]
contacts = ["dep:dziber", "dep:uuid", "dziber/contacts", "topcoat/multipart"]
files = ["dep:dziber", "dziber/files", "topcoat/multipart"]
jabber = ["dep:base64", "dep:dziber", "dziber/web", "dep:fernet", "dep:sha2"]
kanban = ["sql"]
ldap = ["dep:ldap3"]
mail = ["topcoat/mail-smtp"]
sql = ["dep:argon2", "dep:toasty", "dep:toasty-cli"]
webmail = ["dep:dziber", "dziber/mail", "topcoat/multipart"]

[dependencies]
argon2 = { version = "0.6", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", optional = true }
dziber = { path = "dziber", optional = true, default-features = false }
fernet = { version = "0.2.2", optional = true, default-features = false, features = ["rustcrypto"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
ldap3 = { version = "0.12.1", optional = true, default-features = false, features = ["tls-rustls-ring"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "1.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { version = "0.11", optional = true }
toasty = { version = "0.11", features = ["sqlite"], optional = true }
toasty-cli = { version = "0.11", optional = true }
tokio = { version = "1.51.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
uuid = { version = "1", optional = true, features = ["v4"] }
topcoat = { version = "0.12.1", default-features = false, features = ["asset", "cookie", "discover", "font-fontsource", "htmx", "icon-iconify", "router", "runtime", "serve", "view"] }

[build-dependencies]
topcoat = { version = "0.12.1", default-features = false, features = ["icon-iconify"] }

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
